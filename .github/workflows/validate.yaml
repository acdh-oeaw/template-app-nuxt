name: Validate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-validate
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Update visual snapshots and upload them as an artifact
        type: boolean
        default: false

jobs:
  validate:
    name: Validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: true
      matrix:
        node-version: [26.x]
        os: [ubuntu-26.04]

    env:
      NUXT_PUBLIC_APP_BASE_URL: "http://localhost:3000"
      NUXT_PUBLIC_APP_BOTS: "disabled"
      NUXT_PUBLIC_APP_IMPRINT_CUSTOM_CONFIG: "disabled"
      NUXT_PUBLIC_APP_IMPRINT_SERVICE_BASE_URL: "${{ vars.NUXT_PUBLIC_APP_IMPRINT_SERVICE_BASE_URL }}"
      NUXT_PUBLIC_APP_MATOMO_BASE_URL: "${{ vars.NUXT_PUBLIC_APP_MATOMO_BASE_URL || 'https://matomo.acdh.oeaw.ac.at' }}"
      NUXT_PUBLIC_APP_MATOMO_ID: "${{ vars.NUXT_PUBLIC_APP_MATOMO_ID || '1' }}"
      NUXT_PUBLIC_APP_SERVICE_ID: "${{ vars.SERVICE_ID }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:check

      - name: Stylelint
        run: pnpm run styles:check

      - name: Typecheck
        run: pnpm run types:check

      - name: Test
        run: pnpm run test

      - name: Run e2e tests
        run: pnpm run test:e2e:docker ${{ inputs.update-snapshots && '--update-snapshots=changed' || '' }}

      - name: Upload snapshots
        uses: actions/upload-artifact@v7
        if: ${{ success() && inputs.update-snapshots }}
        with:
          name: snapshots
          path: e2e/snapshots/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build-deploy:
    if: ${{ github.event_name == 'push' }}
    needs: [validate]
    uses: ./.github/workflows/build-deploy.yaml
    secrets: inherit
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows#access-and-permissions
    permissions:
      contents: read
      packages: write
